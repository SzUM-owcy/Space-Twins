[project]
name = "nasa-space-apps-2026-poznan-by-pyszna-kawa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
